{% extends 'base.html' %}
{% from 'partials/macros.html' import csrf %}
{% block title %}Log in · {{ brand.name }}{% endblock %}
{% block content %}
<div class="auth"><div class="panel">
  <h1>Log in</h1>
  <form method="post" novalidate>
    {{ csrf() }}<input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="username">Username or email</label><input id="username" name="username" required autofocus autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"><div class="hint"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a></div></div>
    <button class="btn btn-block">Log in</button>
  </form>
  <p class="muted small" style="margin:16px 0 0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></div>
{% endblock %}
